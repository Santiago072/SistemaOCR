name: CI — Sistema OCR & Conciliación Documental

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Backend PHP (PHPUnit & Static Analysis)
  # ─────────────────────────────────────────────────────────────────
  php-tests:
    name: PHP Unit Tests (PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐘 Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, openssl, fileinfo, curl, zip, gd
          coverage: none

      - name: 🗄️ Caché de Composer
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Instalar dependencias Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 🧪 Ejecutar PHPUnit
        run: vendor/bin/phpunit --colors=always

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Python OCR & IA Engine (Pytest / Unittest)
  # ─────────────────────────────────────────────────────────────────
  python-tests:
    name: Python OCR & AI Engine (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: python_ocr/requirements.txt

      - name: 📦 Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r python_ocr/requirements.txt

      - name: 🧪 Ejecutar pruebas unitarias de OCR & Cotejo
        run: python python_ocr/test_ocr_unit.py
